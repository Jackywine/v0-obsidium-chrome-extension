<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidium</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1 class="popup-title">Obsidium</h1>
      <button class="btn btn-ghost btn-icon theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <div class="popup-body">
      <div class="quick-note">
        <textarea 
          class="input quick-note-input" 
          id="quickNote" 
          placeholder="Quick note..."
          rows="4"
        ></textarea>
        <button class="btn btn-primary" id="saveQuickNote">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Save Note
        </button>
      </div>

      <div class="divider"></div>

      <div class="popup-actions">
        <button class="btn" id="openApp">
          <svg class="icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
          Open Full App
        </button>
        <button class="btn" id="openSidePanel">
          <svg class="icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="15" y1="3" x2="15" y2="21"></line>
          </svg>
          Open Side Panel
        </button>
      </div>

      <div class="divider"></div>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-value" id="noteCount">0</span>
          <span class="stat-label">Notes</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="linkCount">0</span>
          <span class="stat-label">Links</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="tagCount">0</span>
          <span class="stat-label">Tags</span>
        </div>
      </div>
    </div>

    <footer class="popup-footer">
      <span class="text-muted">v1.0.0</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
